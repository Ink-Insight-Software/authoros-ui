name: authoros_ui
description: >-
  Flutter widgets AuthorOS Write and the standalone applications share, over
  authoros_core: one renderer for record fields, so a field is drawn and
  edited the same way wherever a record is, and one set of book exporters
  (Markdown, plain text, PDF, Word), so a book or a dossier is set the same way,
  the Loom's graph canvas, so a family tree is drawn the same way, and the
  Linguist's Study's panels, so a language is built the same way.
publish_to: none
version: 0.7.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  # The Word exporter's zip. authoros_core already depends on it, at this
  # range, so an application resolves one copy.
  archive: ^4.0.9
  # Pinned by commit. An application that depends on this package pins
  # authoros_core at the same commit, or pub reports the conflict.
  authoros_core:
    git:
      url: https://github.com/Ink-Insight-Software/authoros-core.git
      ref: 025e9e209446f1d6c6fb2c6d75f7f0b780023214
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  pdf: ^3.13.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
