name: authoros_ui
description: >-
  Flutter widgets AuthorOS Write and the standalone applications share, over
  authoros_core: one renderer for record fields, so a field is drawn and
  edited the same way wherever a record is, and one set of book exporters
  (Markdown, plain text, PDF, Word), so a book or a dossier is set the same way,
  the Loom's graph canvas, so a family tree is drawn the same way, and the
  Linguist's Study's panels, so a language is built the same way.
publish_to: none
version: 0.9.1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  # The Word exporter's zip. authoros_core already depends on it, at this
  # range, so an application resolves one copy.
  archive: ^4.0.9
  # Pinned by commit. An application that depends on this package pins
  # authoros_core at the same commit, or pub reports the conflict.
  authoros_core:
    git:
      url: https://github.com/Ink-Insight-Software/authoros-core.git
      ref: 0087e182401710b4f47aecc8b28e38852b0fbec9
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  pdf: ^3.13.0
  # The PDF renderer's matrix, for mirroring a corner piece. Flutter and pdf
  # already bring it; named because this package now imports it.
  vector_math: ^2.1.4
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

# For this package's own checks only: pub ignores a dependency's overrides, so
# no application is held to this. `book_docx_identity_test.dart` compares an
# exported Word file byte for byte, and a newer `archive` writes the zip
# differently (4.7.1 does; 4.0.9, which AuthorOS Write locks, does not). With
# no lockfile here the range above floats, so the check is held to the version
# that ships.
dependency_overrides:
  archive: 4.0.9
  # `image` 4.10 and later call an `archive` method 4.0.9 does not have, so it
  # is held to the version AuthorOS Write locks as well.
  image: 4.9.1
